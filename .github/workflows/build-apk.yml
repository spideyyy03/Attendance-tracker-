name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: unzip -q AttendanceTrackerApk.zip

      - name: Build release APK
        working-directory: AttendanceTrackerApk
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AttendanceTracker-APK
          path: AttendanceTrackerApk/app/build/outputs/apk/release/*.apk
