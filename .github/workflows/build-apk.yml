      - name: Find and unpack project ZIP
        run: |
          ZIP_PATH=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: No ZIP file found in repository"
            exit 1
          fi
          echo "Using ZIP: $ZIP_PATH"
          unzip -q "$ZIP_PATH"
          echo "Extracted project folders:"
          find . -maxdepth 3 -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \) -print
